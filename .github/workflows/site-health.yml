name: Site health checks
# Reports go to one address only (REPORT_TO_EMAIL secret). Email is sent only on a failure.
on:
  schedule:
    - cron: '17 11 * * *'   # daily uptime check (UTC)
    - cron: '43 11 * * 1'   # weekly broken-link check, Mondays (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'uptime or links'
        default: 'uptime'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "43 11 * * 1" ]; then MODE=links; else MODE=uptime; fi
          fi
          node scripts/site-health.mjs "$MODE"
